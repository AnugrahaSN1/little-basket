<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Basket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Caveat:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a gingham picnic blanket; on it an order card (your settings) and a lined notepad (your list), with a few ants passing by */
:root {
  --cloth: #F7F3EC;
  --check: rgba(214, 64, 52, .22);
  --check-2: rgba(214, 64, 52, .38);
  --paper: #FFFDF6;
  --line: #D9E5EE;
  --margin: #F0A9A0;
  --ink: #2A2420;
  --ink-2: #6C625A;
  --red: #C7362B;
  --leaf: #3C8D4E;
  --leaf-soft: #E3F1E4;
  --honey: #F2B53A;
  --card: #FFFFFF;
  --shadow: 0 2px 0 rgba(42,36,32,.08), 0 18px 34px -18px rgba(42,36,32,.45);
  --f-hand: "Caveat Brush", "Caveat", "Comic Sans MS", cursive;
  --f-note: "Caveat", "Comic Sans MS", cursive;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --cloth: #16201B; --check: rgba(80, 160, 110, .16); --check-2: rgba(80, 160, 110, .28);
  --paper: #23221E; --line: #34404A; --margin: #7A4540; --ink: #F2ECE4; --ink-2: #B9AFA5;
  --red: #F07A6E; --leaf: #7DCB8D; --leaf-soft: #1E3325; --honey: #F2B53A; --card: #2A2925;
  --shadow: 0 2px 0 rgba(0,0,0,.3), 0 18px 34px -18px rgba(0,0,0,.9); color-scheme: dark } }
:root[data-theme="dark"] {
  --cloth: #16201B; --check: rgba(80, 160, 110, .16); --check-2: rgba(80, 160, 110, .28);
  --paper: #23221E; --line: #34404A; --margin: #7A4540; --ink: #F2ECE4; --ink-2: #B9AFA5;
  --red: #F07A6E; --leaf: #7DCB8D; --leaf-soft: #1E3325; --honey: #F2B53A; --card: #2A2925;
  --shadow: 0 2px 0 rgba(0,0,0,.3), 0 18px 34px -18px rgba(0,0,0,.9); color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  background-color: var(--cloth);
  background-image:
    linear-gradient(90deg, var(--check) 50%, transparent 50%),
    linear-gradient(var(--check) 50%, transparent 50%);
  background-size: 56px 56px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; border-radius: 6px; }

header { text-align: center; margin-bottom: 26px; }
.badge { display: inline-block; background: var(--card); padding: 18px 30px 14px; border-radius: 18px; box-shadow: var(--shadow); transform: rotate(-1.5deg); }
h1 { font-family: var(--f-hand); font-weight: 400; font-size: clamp(52px, 9vw, 84px); line-height: .9; margin: 0; color: var(--red); }
h1 span { color: var(--leaf); }
.sub { font-family: var(--f-note); font-size: 24px; color: var(--ink-2); margin: 6px 0 0; }

.flow { max-width: 680px; margin: 0 auto; }
.order .q { font-size: 15px; font-weight: 700; margin: 0; font-family: var(--f-body); }
.step + .step { border-top: 1.5px dashed var(--line); padding-top: 14px; }

/* order card */
.order { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 18px; position: relative; }
.order::before { content: ""; position: absolute; top: -12px; left: 50%; width: 96px; height: 26px; margin-left: -48px; background: color-mix(in srgb, var(--honey) 70%, transparent); transform: rotate(-3deg); border-radius: 3px; }
.order h2 { font-family: var(--f-hand); font-weight: 400; font-size: 32px; margin: 0; line-height: 1; }
.field { display: grid; gap: 8px; }
.field > label, .field > .lbl { font-weight: 700; font-size: 14px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--cloth); padding: 5px; border-radius: 14px; }
.tabs button { border: 0; background: transparent; padding: 9px 4px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; display: grid; gap: 2px; justify-items: center; }
.tabs button small { font-weight: 400; font-size: 11px; color: var(--ink-2); }
.tabs button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.15); color: var(--red); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stepper { display: flex; align-items: center; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; }
.stepper button { border: 0; background: transparent; width: 40px; height: 42px; font-size: 22px; cursor: pointer; }
.stepper button:hover { background: var(--cloth); }
.stepper output { flex: 1; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.budget { display: flex; align-items: center; gap: 12px; }
.budget input[type=range] { flex: 1; accent-color: var(--red); }
.budget output { font-family: var(--f-hand); font-size: 30px; min-width: 76px; text-align: right; color: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chips button { border: 1.5px dashed var(--ink-2); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.chips button[aria-pressed="true"] { border-style: solid; border-color: var(--leaf); background: var(--leaf-soft); color: var(--leaf); font-weight: 600; }
.skip { border: 2px solid var(--ink); border-radius: 12px; padding: 10px 12px; background: transparent; width: 100%; }
.skip::placeholder { color: var(--ink-2); }
.go { background: var(--red); color: #fff; border: 0; border-radius: 14px; padding: 14px; font-family: var(--f-hand); font-size: 26px; cursor: pointer; box-shadow: 0 4px 0 color-mix(in srgb, var(--red) 60%, #000); transition: transform .08s; }
.go:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--red) 60%, #000); }
.order { padding: 24px 22px; gap: 14px; }
.order h2 { font-size: clamp(34px, 5vw, 42px); }
.progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.progress i { height: 6px; border-radius: 99px; background: var(--cloth); border: 1px solid var(--ink-2); }
.progress i.on { background: var(--red); border-color: var(--red); }
.stepno { margin: -8px 0 0; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.step { display: grid; gap: 10px; }
.tabs.big { grid-template-columns: minmax(0, 1fr); gap: 10px; background: transparent; padding: 0; }
.tabs.big button { border: 2px solid var(--ink); justify-items: start; text-align: left; padding: 14px 16px; border-radius: 14px; }
.tabs.big b { font-family: var(--f-hand); font-weight: 400; font-size: 26px; line-height: 1; }
.tabs.big small { font-size: 14px; }
.tabs.big button[aria-pressed="true"] { border-color: var(--red); background: color-mix(in srgb, var(--red) 8%, var(--card)); }
.hint { margin: 0; font-family: var(--f-note); font-size: 20px; color: var(--ink-2); line-height: 1.1; }
.nav { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.back { border: 2px solid var(--ink); background: transparent; border-radius: 14px; padding: 0 20px; font-weight: 600; cursor: pointer; }
.back[hidden] { display: none; }
.nav .go { grid-column: 2; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.actions button { border: 2px solid var(--ink); background: var(--card); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.actions button.primary { background: var(--red); border-color: var(--red); color: #fff; }
.unused { border: 2px solid var(--ink); background: transparent; border-radius: 12px; padding: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }
.tweaks button:hover { background: var(--cloth); }

/* notepad */
.pad { background: var(--paper); border-radius: 6px 6px 16px 16px; box-shadow: var(--shadow); position: relative; padding: 34px 26px 28px 62px; min-width: 0;
  background-image: linear-gradient(transparent 31px, var(--line) 31px, var(--line) 32px); background-size: 100% 32px; background-position: 0 14px; }
.pad::before { content: ""; position: absolute; top: 0; bottom: 0; left: 44px; border-left: 2px solid var(--margin); }
.pad::after { content: ""; position: absolute; top: -10px; left: 24px; right: 24px; height: 20px;
  background: radial-gradient(circle at 10px 10px, var(--cloth) 5px, transparent 6px) 0 0 / 34px 20px repeat-x; }
.pad-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.pad h2 { font-family: var(--f-hand); font-weight: 400; font-size: clamp(34px, 5vw, 44px); line-height: 1; margin: 0; }
.meta { font-family: var(--f-note); font-size: 22px; color: var(--ink-2); line-height: 1; margin-top: 6px; }
.copy { border: 2px solid var(--ink); background: var(--card); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.jar { margin: 18px 0 6px; display: grid; gap: 6px; }
.jar-bar { height: 16px; border-radius: 999px; background: color-mix(in srgb, var(--honey) 20%, transparent); border: 2px solid var(--ink); overflow: hidden; }
.jar-bar i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--honey) 0 8px, color-mix(in srgb, var(--honey) 75%, #fff) 8px 14px); transition: width .5s ease; }
.jar-txt { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-2); gap: 10px; flex-wrap: wrap; }
.jar-txt b { color: var(--ink); font-variant-numeric: tabular-nums; }
.aisle { font-family: var(--f-hand); font-size: 26px; color: var(--leaf); margin: 18px 0 2px; line-height: 32px; }
.items { list-style: none; margin: 0; padding: 0; }
.items li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 32px; }
.items input { width: 18px; height: 18px; accent-color: var(--leaf); margin: 0; cursor: pointer; }
.items label { cursor: pointer; font-size: 15px; min-width: 0; }
.items .q { font-family: var(--f-note); font-size: 22px; color: var(--red); margin-right: 4px; }
.items .price { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.items li.done label { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; color: var(--ink-2); }
.notes { margin-top: 18px; font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; }
.empty { font-family: var(--f-note); font-size: 26px; color: var(--ink-2); padding: 20px 0; line-height: 32px; }

/* meal cards */
.meals { display: grid; gap: 18px; margin-top: 16px; }
.meal { background: var(--card); border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 8px 18px -12px rgba(0,0,0,.4); border-top: 6px solid var(--red); }
.meal:nth-child(2) { border-top-color: var(--leaf); transform: rotate(.4deg); }
.meal:nth-child(3) { border-top-color: var(--honey); transform: rotate(-.4deg); }
.meal h3 { font-family: var(--f-hand); font-weight: 400; font-size: 28px; margin: 0 0 4px; line-height: 1.05; }
.meal .items li { min-height: 28px; }
.meal .tot { display: flex; justify-content: space-between; border-top: 1.5px dashed var(--ink-2); margin-top: 8px; padding-top: 6px; font-weight: 700; }

/* ants */
.ants { position: fixed; left: 0; right: 0; bottom: calc(6px + env(safe-area-inset-bottom, 0px)); height: 14px; pointer-events: none; overflow: hidden; }
.ants span { position: absolute; bottom: 0; width: 14px; height: 8px; animation: walk 38s linear infinite; }
.ants span::before { content: ""; position: absolute; inset: 0; background:
  radial-gradient(circle at 2px 4px, var(--ink) 2px, transparent 2.5px),
  radial-gradient(circle at 7px 4px, var(--ink) 2.4px, transparent 2.9px),
  radial-gradient(circle at 12px 4px, var(--ink) 2px, transparent 2.5px); }
.ants span:nth-child(2) { animation-delay: -4s; } .ants span:nth-child(3) { animation-delay: -8s; }
.ants span:nth-child(4) { animation-delay: -21s; } .ants span:nth-child(5) { animation-delay: -24s; }
@keyframes walk { from { left: -20px; } to { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .ants { display: none; } .jar-bar i { transition: none; } }
.toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="badge">
      <h1>Little <span>Basket</span></h1>
      <p class="sub">tell me who's eating, I'll write the list</p>
    </div>
  </header>

  <div class="flow">
    <form class="order" id="form" aria-label="Your preferences">
      <h2>Tell me about your shop</h2>

      <div class="step">
        <h3 class="q">What are we shopping for?</h3>
        <div class="tabs" role="group" aria-label="List type">
          <button type="button" data-mode="week" aria-pressed="true">The week<small>full shop</small></button>
          <button type="button" data-mode="picnic" aria-pressed="false">A picnic<small>no cooking</small></button>
          <button type="button" data-mode="meals" aria-pressed="false">Dinner<small>3 ideas</small></button>
        </div>
      </div>

      <div class="step">
        <h3 class="q">Who's eating?</h3>
        <div class="row2">
          <div class="field">
            <span class="lbl" id="ppl-l">People</span>
            <div class="stepper" aria-labelledby="ppl-l">
              <button type="button" data-step="people" data-d="-1" aria-label="Fewer people">−</button>
              <output id="people">2</output>
              <button type="button" data-step="people" data-d="1" aria-label="More people">+</button>
            </div>
          </div>
          <div class="field" id="days-f">
            <span class="lbl" id="days-l">For how many days</span>
            <div class="stepper" aria-labelledby="days-l">
              <button type="button" data-step="days" data-d="-1" aria-label="Fewer days">−</button>
              <output id="days">7</output>
              <button type="button" data-step="days" data-d="1" aria-label="More days">+</button>
            </div>
          </div>
        </div>
      </div>

      <div class="step">
        <h3 class="q">What's the budget?</h3>
        <div class="budget"><input id="budget" type="range" min="5" max="250" step="1" value="60" aria-label="Budget in euros"><output id="budget-o">€60</output></div>
        <p class="hint" id="budget-hint"></p>
      </div>

      <div class="step">
        <h3 class="q">Any food needs?</h3>
        <div class="chips" id="diets">
          <button type="button" data-d="vegetarian" aria-pressed="false">Vegetarian</button>
          <button type="button" data-d="vegan" aria-pressed="false">Vegan</button>
          <button type="button" data-d="pescatarian" aria-pressed="false">Pescatarian</button>
          <button type="button" data-d="gluten" aria-pressed="false">Gluten-free</button>
          <button type="button" data-d="dairy" aria-pressed="false">Dairy-free</button>
          <button type="button" data-d="nuts" aria-pressed="false">Nut-free</button>
          <button type="button" data-d="pork" aria-pressed="false">No pork</button>
          <button type="button" data-d="protein" aria-pressed="false">High protein</button>
        </div>
        <div class="field">
          <label for="skip">Anything to leave out?</label>
          <input id="skip" class="skip" placeholder="e.g. mushrooms, tuna, olives" autocomplete="off">
        </div>
      </div>
      <button type="submit" class="go">Write my list</button>

    </form>

    <section class="pad" aria-live="polite" id="pad" hidden></section>
  </div>
</div>
<div class="ants" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
<div class="toast" id="toast" hidden></div>

// ---------- rules ----------
const lower = s => s.toLowerCase();
const has = (n, words) => words.some(w => n.includes(w));
const GLUTEN = ["pasta", "spaghetti", "penne", "macaroni", "tagliatelle", "bread", "baguette", "loaf", "couscous", "semolina",
  "bulgur", "seitan", "oats", "muesli", "cornflakes", "wraps", "pizza", "nuggets", "lasagne", "quiche", "egg noodles",
  "crispbread", "brioche", "croissant", "flour", "biscuit", "crackers", "cereal bars", "soy sauce", "cottage pie", "tabbouleh", "caesar"];
const DAIRY_SUBS = ["Cheese", "Milk", "Yogurt", "Butter & Cream"];
const DAIRY = ["cheese", "pizza", "lasagne", "caesar", "quiche", "gratin", "cottage pie", "croissant", "brioche", "ice cream",
  "pudding", "petits suisses", "chocolate spread", "butter biscuits", "crème"];
const NUTS = [/\bnuts?\b/, /peanut/, /almond/, /pesto/, /muesli/, /cereal bars/];
const PORK = ["ham", "bacon", "sausage", "lardons", "pork", "quiche lorraine"];

function allowed(it) {
  const n = lower(it.n), d = S.diet;
  if (d.has("vegan") && !it.t.includes("vegan")) return false;
  if (d.has("vegetarian") && !it.t.includes("vegetarian")) return false;
  if (d.has("pescatarian")) {
    if (it.c === "Meat & Fish" && !["Fish", "Seafood"].includes(it.s)) return false;
    if ((it.c === "Ready Meals" || it.s === "Pizza") && !it.t.includes("vegetarian") && !n.includes("tuna")) return false;
  }
  if (d.has("gluten") && !n.includes("gluten-free") && !n.includes("rice noodles") && has(n, GLUTEN)) return false;
  if (d.has("dairy") && (DAIRY_SUBS.includes(it.s) || has(n, DAIRY))) return false;
  if (d.has("nuts") && NUTS.some(r => r.test(n))) return false;
  if (d.has("pork") && (it.s === "Pork" || has(n, PORK))) return false;
  const skips = S.skip.split(/[,;]/).map(w => lower(w.trim()).replace(/(es|s)$/, "")).filter(w => w.length > 2);
  if (skips.some(w => n.includes(w))) return false;
  return true;
}

function role(it) {
  const { c, s } = it;
  if (has(lower(it.n), ["flour", "sugar", "stock cubes", "semolina", "lemons"])) return "other";   // baking staples: not auto-added
  if (c === "Fruits & Vegetables") return "produce";
  if (c === "Meat & Fish") return "animal_protein";
  if (c === "Dairy & Eggs" && s === "Eggs") return "animal_protein";
  if (c === "Plant Protein") return "plant_protein";
  if (c === "Dairy & Eggs") return "dairy";
  if (c === "Pantry" && ["Pasta", "Rice", "Grains", "Noodles", "Breakfast"].includes(s)) return "carbs";
  if (c === "Bakery" || (c === "Frozen" && s === "Potatoes")) return "carbs";
  if (c === "Pantry") return "pantry";
  if (c === "Frozen" && s === "Vegetables") return "frozen";
  if (c === "Frozen" || c === "Ready Meals") return "ready";
  if (c === "Snacks") return "snacks";
  if (c === "Beverages") return "drinks";
  return "other";
}

// picnic: only things you can eat outdoors without cooking
function picnicRole(it) {
  const n = lower(it.n), { c, s } = it;
  if (s === "Fruits" && !has(n, ["lemon", "juicing", "pineapple"])) return "fruit";
  if (s === "Vegetables" && c === "Fruits & Vegetables" && has(n, ["tomato", "cucumber", "grated carrot", "mixed salad", "beetroot"])) return "crunch";
  if (c === "Bakery" && !has(n, ["crispbread", "brioche"])) return "bread";
  if (s === "Cheese" && !has(n, ["grated", "raclette", "parmesan"])) return "cheese";
  if (has(n, ["cooked ham", "sliced turkey", "smoked salmon", "cooked prawns", "tabbouleh", "caesar", "quiche", "chicken salad wraps", "smoked tofu"])) return "deli";
  if (c === "Snacks") return "snacks";
  if (["Water", "Juice", "Soft Drinks"].includes(s)) return "drinks";
  return null;
}

const SHARES = {
  week: { produce: .20, animal_protein: .17, plant_protein: .10, dairy: .12, carbs: .16, pantry: .07, frozen: .04, ready: .04, snacks: .05, drinks: .05 },
  picnic: { fruit: .18, crunch: .10, bread: .16, cheese: .14, deli: .16, snacks: .12, drinks: .14 },
};

// sensible order inside a group: water and juice before fizzy drinks
const DEPRIORITISE = { "Soft Drinks": 1.8, "Coffee & Tea": 1.5, "Pastries": 1.3, "Desserts": 1.4 };

// small seeded random, so "Shuffle" gives a new but repeatable list
function rng(seed) { let x = seed * 9301 + 49297; return () => ((x = (x * 9301 + 49297) % 233280) / 233280); }

function ordered(pool, roleName, roleFn) {
  const r = rng(S.seed + roleName.length * 7);
  let sub = pool.filter(it => roleFn(it) === roleName).map(it => ({ it, k: it.p * (1 + (S.seed ? r() * .9 : 0)) * (DEPRIORITISE[it.s] || 1) }));
  if (S.diet.has("protein") && /protein|deli|cheese/.test(roleName)) sub.forEach(o => o.k = -o.it.pr / o.it.p);
  sub.sort((a, b) => a.k - b.k);
  const groups = {}; sub.forEach(o => (groups[o.it.s] ||= []).push(o.it));   // variety: one of each subcategory in turn
  const g = Object.values(groups), out = [];
  for (let i = 0; g.some(x => x.length > i); i++) g.forEach(x => x[i] && out.push(x[i]));
  return out;
}

function buildBasket() {
  const isPicnic = S.mode === "picnic", roleFn = isPicnic ? picnicRole : role;
  const pool = CATALOGUE.filter(it => roleFn(it) && allowed(it));
  if (!pool.length) return null;
  let share = { ...SHARES[isPicnic ? "picnic" : "week"] };
  if (S.diet.has("protein") && !isPicnic) { ["snacks", "ready", "drinks"].forEach(k => share[k] *= .4); share.plant_protein += .05; share.animal_protein += .05; }
  for (const k in share) if (!pool.some(it => roleFn(it) === k)) delete share[k];      // e.g. no meat for vegetarians
  const tot = Object.values(share).reduce((a, b) => a + b, 0);
  for (const k in share) share[k] /= tot;

  const scale = isPicnic ? Math.max(1, S.people / 3) : Math.max(1, S.people * S.days / 7);
  const cap = k => Math.max(1, Math.ceil(scale * (k === "produce" || k === "fruit" ? 1.5 : 1)));
  const basket = new Map(); let spent = 0;
  const add = it => { basket.set(it.id, { it, q: (basket.get(it.id)?.q || 0) + 1 }); spent += it.p; };
  const roles = Object.keys(share).sort((a, b) => share[b] - share[a]);
  const lists = Object.fromEntries(roles.map(k => [k, ordered(pool, k, roleFn)]));

  for (const k of roles) {
    let rs = 0; const rb = S.budget * share[k];
    for (let p = 1; p <= cap(k); p++) for (const it of lists[k]) {
      if ((basket.get(it.id)?.q || 0) >= p) continue;
      if (rs + it.p <= rb && spent + it.p <= S.budget) { add(it); rs += it.p; }
    }
  }
  const minP = Math.min(...pool.map(i => i.p));
  for (let n = 0; n < 300 && S.budget - spent >= minP && spent < .985 * S.budget; n++) {     // use the rest, least-filled first
    const used = Object.fromEntries(roles.map(k => [k, 0]));
    basket.forEach(({ it, q }) => { const k = roleFn(it); if (k in used) used[k] += it.p * q; });
    let added = false;
    for (const k of roles.sort((a, b) => used[a] / share[a] - used[b] / share[b])) {
      const it = lists[k].find(it => (basket.get(it.id)?.q || 0) < cap(k) * 2 + 1 && it.p <= S.budget - spent);
      if (it) { add(it); added = true; break; }
    }
    if (!added) break;
  }
  return { items: [...basket.values()], total: spent };
}

function buildMeals() {
  const pool = CATALOGUE.filter(allowed), packs = Math.max(1, Math.ceil(S.people / 2));
  const built = [];
  for (const [mi, [title, slots]] of MEALS.entries()) {
    const used = new Set(), items = []; let ok = true;
    slots.forEach(([subs, inc, exc], i) => {
      let d = pool.filter(it => subs.split("|").includes(it.s) && !used.has(it.id));
      if (inc) d = d.filter(it => inc.split("|").some(w => lower(it.n).includes(w)));
      if (exc) d = d.filter(it => !exc.split("|").some(w => lower(it.n).includes(w)));
      d.sort((a, b) => S.diet.has("protein") ? b.pr / b.p - a.pr / a.p : a.p - b.p);
      if (!d.length) { if (i < 2) ok = false; return; }
      const pick = i < 2 ? d[0] : d[(mi + S.seed) % d.length];     // vary the vegetables between meals
      used.add(pick.id); items.push({ it: pick, q: packs });
    });
    if (ok) built.push({ title, items, total: items.reduce((a, b) => a + b.it.p * b.q, 0) });
  }
  let fit = built.filter(m => m.total <= S.budget);
  const list = (fit.length ? fit : built);
  const k = S.seed % Math.max(1, list.length);
  return list.slice(k).concat(list.slice(0, k)).slice(0, 3);
}

function render() {
  const pad = document.getElementById("pad");
  const who = `${S.people} ${S.people === 1 ? "person" : "people"}`;
  if (S.mode === "meals") {
    const meals = buildMeals();
    if (!meals.length) { pad.innerHTML = `<h2>Hmm…</h2><p class="empty">I couldn't find a dinner with those food needs. Try removing one.</p>${ACTIONS}`; lastText = ""; bindActions(); return; }
    pad.innerHTML = `<div class="pad-head"><div><h2>Dinner ideas</h2><p class="meta">for ${who} · up to ${eur(S.budget)}</p></div></div>${ACTIONS}
      <div class="meals">${meals.map((m, j) => `<article class="meal"><h3>${esc(m.title)}</h3><ul class="items">${itemRows(m.items, "m" + j + "_")}</ul>
      <div class="tot"><span>Total</span><span>${eur(m.total)}${m.total > S.budget ? " · over budget" : ""}</span></div></article>`).join("")}</div>
      <div class="notes">${["One pack is assumed to feed about 2 people.", ...dietNote()].map(t => `<span>${t}</span>`).join("")}</div>`;
    lastText = meals.map(m => `${m.title} (${eur(m.total)})\n` + m.items.map(({ it, q }) => `- ${q} x ${it.n}`).join("\n")).join("\n\n");
  } else {
    const res = buildBasket();
    if (!res || !res.items.length) { pad.innerHTML = `<h2>Hmm…</h2><p class="empty">Nothing fits those food needs and that budget. Try a bigger budget or fewer filters.</p>${ACTIONS}`; lastText = ""; bindActions(); return; }
    const groups = {}; res.items.forEach(x => (groups[x.it.c] ||= []).push(x));
    const pct = Math.min(100, res.total / S.budget * 100), count = res.items.reduce((a, b) => a + b.q, 0);
    const title = S.mode === "picnic" ? "Picnic basket" : "Shopping list";
    const meta = S.mode === "picnic" ? `for ${who} · one sunny afternoon` : `for ${who} · ${S.days} ${S.days === 1 ? "day" : "days"}`;
    pad.innerHTML = `<div class="pad-head"><div><h2>${title}</h2><p class="meta">${meta}</p></div></div>${ACTIONS}
      <div class="jar"><div class="jar-bar"><i style="width:${pct}%"></i></div>
      <div class="jar-txt"><span><b>${eur(res.total)}</b> of ${eur(S.budget)}</span><span>${count} items · <b>${eur(S.budget - res.total)}</b> left</span></div></div>
      ${AISLES.filter(a => groups[a]).map(a => `<div class="aisle">${AISLE_NAME[a]}</div><ul class="items">${itemRows(groups[a].sort((x, y) => x.it.s.localeCompare(y.it.s)), "i" + AISLES.indexOf(a) + "_")}</ul>`).join("")}
      <div class="notes">${(res.total < .9 * S.budget ? ["That's plenty for this many people, so I stopped before spending the whole budget."] : []).concat(dietNote()).map(t => `<span>${t}</span>`).join("")}</div>`;
    lastText = `${title} (${meta})\n` + AISLES.filter(a => groups[a]).map(a => `\n${AISLE_NAME[a]}\n` + groups[a].map(({ it, q }) => `- ${q} x ${it.n}`).join("\n")).join("\n") + `\n\nTotal: ${eur(res.total)}`;
  }
  pad.querySelectorAll(".items input").forEach(cb => cb.addEventListener("change", () => cb.closest("li").classList.toggle("done", cb.checked)));
  bindActions();
}

function bindActions() {
  document.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
    const a = b.dataset.act;
    if (a === "edit") showForm();
    if (a === "cheaper") { S.budget = Math.max(5, Math.round(S.budget * .85)); save(); syncUI(); render(); toast("Trimmed the budget by 15%"); }
    if (a === "shuffle") { S.seed += 1; render(); }
    if (a === "copy") copyList();
  }));
}

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 1800); }
function copyList() {
  navigator.clipboard?.writeText(lastText).then(() => toast("List copied"), fallback) ?? fallback();
  function fallback() { const ta = document.createElement("textarea"); ta.value = lastText; document.body.append(ta); ta.select();
    try { document.execCommand("copy"); toast("List copied"); } catch (e) { toast("Select the list to copy it"); } ta.remove(); }
}

// ---------- controls ----------
function syncUI() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
  document.getElementById("days-f").hidden = S.mode !== "week";
  document.getElementById("people").textContent = S.people;
  document.getElementById("days").textContent = S.days;
  document.getElementById("budget").value = S.budget;
  document.getElementById("budget-o").textContent = "€" + Math.round(S.budget);
  document.getElementById("skip").value = S.skip;
  document.querySelectorAll("#diets button").forEach(b => b.setAttribute("aria-pressed", S.diet.has(b.dataset.d)));
  const per = S.mode === "week" ? S.budget / (S.people * S.days) : S.budget / S.people;
  document.getElementById("budget-hint").textContent = S.mode === "week"
    ? `about €${per.toFixed(2)} per person per day` : `about €${per.toFixed(2)} per person`;
}

// page 1: preferences; page 2: the list
const listShown = () => !document.getElementById("pad").hidden;
function update() { save(); syncUI(); if (listShown()) render(); }
function showForm() {
  document.getElementById("pad").hidden = true; document.getElementById("form").hidden = false;
  syncUI(); window.scrollTo({ top: 0 });
}
function showList() {
  S.skip = document.getElementById("skip").value; S.seed = 0; save();
  document.getElementById("form").hidden = true; document.getElementById("pad").hidden = false;
  render(); window.scrollTo({ top: 0 });
}
document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); showList(); });

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  S.mode = b.dataset.mode;
  if (S.mode === "week" && S.budget < 40) S.budget = Math.min(250, 30 * S.people);
  if (S.mode === "picnic") S.budget = Math.min(S.budget, 15 * S.people + 10);
  if (S.mode === "meals") S.budget = Math.min(S.budget, 25);
  S.seed = 0; update();
}));
document.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.step, lim = k === "people" ? [1, 12] : [1, 14];
  S[k] = Math.min(lim[1], Math.max(lim[0], S[k] + Number(b.dataset.d))); update();
}));
document.getElementById("budget").addEventListener("input", e => { S.budget = Number(e.target.value); update(); });
document.getElementById("skip").addEventListener("input", e => { S.skip = e.target.value; save(); });
document.querySelectorAll("#diets button").forEach(b => b.addEventListener("click", () => {
  const d = b.dataset.d; S.diet.has(d) ? S.diet.delete(d) : S.diet.add(d);
  if (d === "vegan" && S.diet.has("vegan")) S.diet.add("vegetarian");
  update();
}));

update();
</script>

</body>
</html>
